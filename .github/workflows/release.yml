name: Release

# HACS installs a Lovelace card from the file attached to a release, so the
# built bundle must be uploaded as a release asset. dist/ is not tracked in git.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

      - name: Attach bundle to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/animated-slideshow-card.js
